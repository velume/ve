<style>
/* =========================================================
   VELUME NAILS · Sistema visual
   Layout: mobile-first, una columna que se abre a grilla en ≥760px.
   Mundo visual único (claro): nude, blanco, tinta y dorado sutil.
   ========================================================= */
:root{
  --paper:#FFFCFA;        /* fondo principal, blanco cálido */
  --nude:#EBDCD2;         /* nude principal */
  --nude-soft:#F6EEE8;    /* superficies suaves */
  --ink:#1C1715;          /* texto y botones primarios */
  --muted:#7C6D65;        /* texto secundario */
  --gold:#A9864F;         /* detalles dorados */
  --line:#E7DCD4;         /* divisores */
  --ok:#4F7A5A; --warn:#B07A2A; --bad:#A4473F; /* estados semánticos */
  --font-display:"Bodoni Moda", "Didot", "Times New Roman", serif;
  --font-body:"Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  --radius:14px;
  --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .25s var(--ease),background .25s,color .25s,opacity .25s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.7rem}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.85rem}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(255,252,250,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.scrolled{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--font-display);font-size:1.45rem;letter-spacing:.04em;text-decoration:none;color:var(--ink)}
.logo em{color:var(--gold);font-style:italic}
.nav{display:none;gap:28px}
.nav a{color:var(--ink);text-decoration:none;font-size:.82rem;letter-spacing:.12em;text-transform:uppercase}
.nav a:hover{color:var(--gold)}
@media(min-width:760px){.nav{display:flex}}

/* ---------- Hero ---------- */
.hero{padding:28px 0 48px}
.hero .wrap{display:grid;gap:32px}
.hero h1{font-size:clamp(2.5rem,9vw,4.6rem);letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:var(--gold);background:linear-gradient(transparent 80%,rgba(169,134,79,.25) 80%) no-repeat;background-size:0% 100%;animation:paint 1.3s .6s var(--ease) forwards}
@keyframes paint{to{background-size:100% 100%}}
.hero p.lead{font-size:1.06rem;color:var(--muted);max-width:34ch;margin:18px 0 26px;font-weight:300}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.trust b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.35rem;color:var(--ink)}
.hero-art{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1/1;max-height:560px}
.hero-art{position:relative}
.hero-art .sh{position:relative;overflow:hidden;border-radius:var(--radius);animation:rise .9s var(--ease) both}
.hero-art .sh:nth-child(2){animation-delay:.15s}.hero-art .sh:nth-child(3){animation-delay:.3s}
.hero-art .sh:first-child{grid-row:1/3}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art .sh::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 5.5s 1.4s var(--ease) infinite;pointer-events:none}
.hero-art .sh:nth-child(2)::after{animation-delay:1.8s}.hero-art .sh:nth-child(3)::after{animation-delay:2.2s}
@keyframes sweep{0%{transform:translateX(-120%)}30%,100%{transform:translateX(120%)}}
.spark{position:absolute;width:16px;height:16px;pointer-events:none;color:var(--gold);opacity:0;animation:twinkle 2.8s ease-in-out infinite;z-index:2}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
/* Cinta de tendencias */
.ticker{overflow:hidden;border-top:1px solid var(--line);background:var(--nude-soft);padding:14px 0}
.ticker-track{display:flex;width:max-content;animation:marquee 36s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker span{font-family:var(--font-display);font-style:italic;font-size:1.2rem;white-space:nowrap;display:inline-flex;align-items:center;gap:36px;padding-right:36px}
.ticker span::after{content:"\2726";font-style:normal;color:var(--gold);font-size:.75rem}
@keyframes marquee{to{transform:translateX(-50%)}}
/* Aparición al hacer scroll */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:calc(var(--i,0) * 90ms)}
.reveal.in{opacity:1;transform:none}
.sec-head h2 em{color:var(--gold);font-style:italic}
/* Confeti al reservar */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:50% 50% 45% 45%/65% 65% 35% 35%;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media(min-width:760px){.hero{padding:56px 0 72px}.hero .wrap{grid-template-columns:1fr 1fr;align-items:center;gap:56px}}

/* ---------- Secciones ---------- */
section{scroll-margin-top:72px}
.sec{padding:56px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.sec-head h2{font-size:clamp(1.9rem,6vw,2.8rem)}

/* ---------- Filtros ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -20px 18px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 16px;font-size:.8rem;cursor:pointer;white-space:nowrap;transition:all .25s var(--ease)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- Galería ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:22px}}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;animation:rise .5s var(--ease) both}
.card .ph{position:relative;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:var(--nude-soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .ph img{transform:scale(1.04)}
.badge{position:absolute;top:10px;left:10px;background:rgba(255,252,250,.92);color:var(--ink);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
.badge.star{left:auto;right:10px;background:var(--ink);color:var(--paper)}
.badge.trend{top:auto;bottom:10px;background:var(--gold);color:#fff}
.card .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none}
.card:hover .ph::after{transform:translateX(120%)}
.card h3{font-size:1.12rem}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted)}
.card .meta b{color:var(--ink);font-weight:500}
.empty{padding:40px 0;color:var(--muted);text-align:center;grid-column:1/-1}
@keyframes rise{from{opacity:.001;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- Servicios / proceso ---------- */
.steps{display:grid;gap:14px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--nude-soft)}
.step .n{font-family:var(--font-display);font-style:italic;color:var(--gold);font-size:1.6rem}
.step h3{font-size:1.15rem;margin:6px 0}
.step p{margin:0;font-size:.9rem;color:var(--muted)}

/* ---------- Ubicación (solo zona) ---------- */
.zone{display:grid;gap:24px;align-items:center}
@media(min-width:760px){.zone{grid-template-columns:1fr 1fr}}
.zone-map{aspect-ratio:4/3;border-radius:var(--radius);background:var(--nude-soft);overflow:hidden;position:relative}
.zone-map svg{width:100%;height:100%}
.privacy{display:flex;gap:12px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);font-size:.9rem;color:var(--muted);margin-top:18px}
.privacy svg{flex:none;color:var(--gold)}

/* ---------- Footer ---------- */
footer{padding:36px 0 110px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
footer a{color:var(--muted)}
@media(min-width:760px){footer{padding-bottom:36px}}

/* CTA fijo en celular */
.sticky-cta{position:fixed;left:16px;right:16px;bottom:16px;z-index:25;transition:transform .35s var(--ease),opacity .35s}
.sticky-cta .btn{width:100%;box-shadow:0 10px 30px rgba(28,23,21,.22)}
.sticky-cta.hide{transform:translateY(120%);opacity:0}
@media(min-width:760px){.sticky-cta{display:none}}

/* ---------- Modal / hoja ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(28,23,21,.42);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s var(--ease)}
.overlay.open{opacity:1}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;transform:translateY(40px);transition:transform .4s var(--ease);position:relative}
.overlay.open .sheet{transform:none}
@media(min-width:760px){.overlay{align-items:center;padding:24px}.sheet{border-radius:22px;max-height:90%}}
.sheet-head{position:sticky;top:0;background:var(--paper);z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.x:hover{border-color:var(--ink)}
.sheet-body{padding:20px}
.detail img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius)}
.detail h2{font-size:1.9rem;margin:18px 0 6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.facts div{padding:12px;border:1px solid var(--line);border-radius:12px}
.facts small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- Wizard de reserva ---------- */
.progress{display:flex;gap:6px;padding:14px 20px 0}
.progress span{flex:1;height:3px;border-radius:3px;background:var(--line);transition:background .4s}
.progress span.on{background:var(--ink)}
.wz-title{font-size:1.6rem;margin:6px 0 4px}
.pane{animation:fade .35s var(--ease)}
@keyframes fade{from{opacity:.001;transform:translateX(14px)}to{opacity:1;transform:none}}
.opt-list{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--nude-soft)}
.opt img{width:58px;height:58px;border-radius:10px;object-fit:cover;flex:none}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-weight:500}
.opt .t small{color:var(--muted)}
.opt .p{font-size:.9rem;white-space:nowrap}
.wz-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.wz-foot .btn{flex:1;letter-spacing:.08em;padding:0 16px}
.wz-foot .btn.ghost{flex:0 0 auto}

/* Calendario */
.cal{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-family:var(--font-display);font-weight:400;font-size:1.15rem;text-transform:capitalize}
.cal-nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer}
.cal-nav[disabled]{opacity:.3}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-grid .dow{font-size:.66rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:4px 0}
.day{aspect-ratio:1/1;border-radius:50%;border:0;background:none;cursor:pointer;font-variant-numeric:tabular-nums;font-size:.92rem;transition:background .2s,color .2s;position:relative}
.day:hover:not([disabled]){background:var(--nude-soft)}
.day[disabled]{color:#CBBFB8;cursor:default}
.day.today::after{content:"";position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media(min-width:480px){.slots{grid-template-columns:repeat(4,1fr)}}
.slot{padding:11px 0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer;font-variant-numeric:tabular-nums;transition:all .2s}
.slot:hover{border-color:var(--ink)}
.slot[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper);font-size:16px;transition:border-color .2s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.field .err{font-size:.8rem;color:var(--bad);min-height:0}
.field.invalid input{border-color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}.field input,.field select,.field textarea{width:100%}
.hint{font-size:.8rem;color:var(--muted)}

/* Confirmación */
.summary{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:18px}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.92rem}
.summary div:last-child{border-bottom:0}
.summary span{color:var(--muted)}
.summary b{font-weight:500;text-align:right}
.notice{margin-top:14px;padding:16px;border-radius:var(--radius);background:var(--nude-soft);font-size:.9rem}
.notice h3{font-size:1.1rem;margin-bottom:6px}
.notice p{margin:6px 0 0}
.code{font-family:var(--font-display);font-size:1.2rem;letter-spacing:.08em}
.done-mark{width:58px;height:58px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);margin-bottom:10px;animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:.001}to{transform:none;opacity:1}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;z-index:80;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:999px;font-size:.88rem;transition:all .35s var(--ease);pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   PANEL ADMIN
   ========================================================= */
.admin{min-height:100%;background:var(--nude-soft)}
.admin .top{background:rgba(246,238,232,.9)}
.login{max-width:380px;margin:9vh auto 0;padding:32px 24px;background:var(--paper);border:1px solid var(--line);border-radius:22px}
.login h1{font-size:2rem;margin:6px 0 4px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:999px;margin:20px 0;overflow-x:auto}
.tab{flex:1;border:0;background:none;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.tile small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tile b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.8rem;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.toolbar .chips{margin:0;padding:0}
.day-group{margin-bottom:18px}
.day-group h3{font-size:1.05rem;margin:0 0 8px;text-transform:capitalize}
.bk{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:8px;animation:rise .35s var(--ease) both}
.bk.confirmado{border-left-color:var(--ok)}
.bk.cancelado{border-left-color:var(--bad);opacity:.6}
.bk-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.bk-time{font-family:var(--font-display);font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1}
.bk-who b{font-weight:500}
.bk-who small{display:block;color:var(--muted)}
.pill{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.pendiente{background:#F5E6CF;color:#7A5216}
.pill.confirmado{background:#DDEBDF;color:#2F5A3A}
.pill.cancelado{background:#F2DAD6;color:#7E2F28}
.bk-actions{display:flex;gap:8px;flex-wrap:wrap}
.adm-list{display:grid;gap:10px}
.adm-item{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}

.try-stage img.swap{opacity:.2;transform:scale(.97)}
.try-stage .lbl{position:absolute;left:14px;bottom:14px;background:rgba(255,252,250,.94);border-radius:999px;padding:8px 14px;font-size:.78rem;z-index:2}

.try-group>small{display:block;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}

/* Gift card */
.gift{display:grid;gap:30px;align-items:center;background:var(--ink);color:#F3E6D3;border-radius:26px;padding:34px 24px;position:relative;overflow:hidden}
@media(min-width:760px){.gift{grid-template-columns:1.1fr 1fr;padding:56px}}
.gift h2{color:#fff;font-size:clamp(2rem,6vw,3rem)}
.gift h2 em{color:#E8C98E}
.gift p{color:#CDBFB3;max-width:44ch}
.gift .eyebrow{color:#E8C98E}
.gift .btn{background:#E8C98E;border-color:#E8C98E;color:var(--ink)}
.gift .btn.ghost{background:transparent;color:#F3E6D3;border-color:rgba(243,230,211,.4)}

  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

<!-- Raíz de la app: el router decide si muestra el sitio público o el panel -->

<script>
/* =========================================================
   VELUME NAILS · Aplicación
   Módulos:
     1. CONFIG ........ valores por defecto del estudio
     2. Store ......... capa de datos (localStorage + memoria)
     3. Utils ......... fechas, formato, escape, teléfonos
     4. NailArt ....... ilustraciones SVG de muestra

     6. Public ........ hero, galería, detalle, zona

   ========================================================= */
"use strict";

/* ---------- 1. CONFIG ---------- */
const CONFIG = {
  studioName: "Velume Nails",
  categories: ["Soft Gel", "Kapping"],

      { id: "kp", title: "Kapping", category: "Kapping", price: 24000, duration: 90, featured: true, available: true,
        desc: "Baño de gel sobre tu uña natural para fortalecerla y que crezca sana. Ideal si querés mantener tu propio largo.", art: { base: "#E7C4B8", accent: "#E7C4B8", pattern: "solid" } }
    ];
    const bookings = [

/* ---------- 3. UTILS ---------- */
const Utils = {
  esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
  money(n) { return "$" + Math.round(n).toLocaleString("es-AR"); },
  dur(m) { const h = Math.floor(m / 60), r = m % 60; return (h ? h + " h" : "") + (h && r ? " " : "") + (r ? r + " min" : ""); },
  today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; },
  addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; },
  iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); },
  parseIso(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); },
  toMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; },
  toHHMM(m) { return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); },
  longDate(s) { return Utils.parseIso(s).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }); },
  uid(p) { return p + Math.random().toString(36).slice(2, 9); },
  code() { const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s = "VN-"; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; },
  // Normaliza teléfonos argentinos para wa.me (54 9 + área + número)
  waNumber(raw) {
    let n = String(raw).replace(/\D/g, "");
    if (n.startsWith("00")) n = n.slice(2);
    if (n.startsWith("54")) { n = n.slice(2); }
    if (n.startsWith("9")) n = n.slice(1);
    if (n.startsWith("0")) n = n.slice(1);
    // quita el "15" de celulares escritos como 2281 15 456789
    const m = n.match(/^(\d{2,4})15(\d{6,8})$/);
    if (m && (m[1].length + m[2].length) === 10) n = m[1] + m[2];
    return "549" + n;
  },
  validPhone(raw) { const n = String(raw).replace(/\D/g, ""); return n.length >= 10 && n.length <= 13; },
  waLink(number, text) { return "https://wa.me/" + number + "?text=" + encodeURIComponent(text); },
  async sha256(text) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    } catch (e) { // respaldo si subtle no está disponible
      let h = 5381; for (const ch of text) h = ((h << 5) + h + ch.charCodeAt(0)) >>> 0; return "djb2-" + h.toString(16);
    }
  },
  // Convierte una imagen en data URL a File (sin await, para no perder el gesto del usuario al compartir)
  dataUrlToFile(dataUrl, name) {
    const [head, b64] = dataUrl.split(",");
    const mime = (head.match(/data:([^;]+)/) || [])[1] || "image/jpeg";
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new File([arr], name, { type: mime });
  },
  // Reduce una foto subida a máx. 900px y JPEG 0.82 para no llenar el almacenamiento
  resizeImage(file, max = 900) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onerror = reject;
      r.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.82));
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }
};

    if (a.pattern === "leaf") extra = `<g clip-path="url(#${id})" fill="${a.accent}"><path d="M${x + w * .2},${y + h * .2} l${w * .35},-6 l-4,${h * .22} l-${w * .3},6 z"/><path d="M${x + w * .45},${y + h * .62} l${w * .4},4 l-8,${h * .16} z" opacity=".85"/></g>`;
    if (a.pattern === "aura") fill = "url(#ag)";
    if (a.pattern === "microfrench") extra = `<path d="M${x - 2},${y + h * .14} Q${x + w / 2},${y + h * .06} ${x + w + 2},${y + h * .14} L${x + w + 2},${y - 2} L${x - 2},${y - 2} Z" fill="${a.accent}" clip-path="url(#${id})"/>`;
    if (a.pattern === "swirl") {
      const anim = ANIM ? `<animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" begin="${.3 + i * .2}s" fill="freeze"/>` : "";
      const off = ANIM ? 100 : 0;
      extra = `<g clip-path="url(#${id})" fill="none" stroke-linecap="round" stroke-width="${w * .14}"><path pathLength="100" stroke-dasharray="100" stroke-dashoffset="${off}" d="M${x - 6},${y + h * .25} C${x + w * .5},${y + h * .02} ${x + w * .25},${y + h * .55} ${x + w + 6},${y + h * .38}" stroke="${a.accent}">${anim}</path><path pathLength="100" stroke-dasharray="100" stroke-dashoffset="${off}" d="M${x - 6},${y + h * .72} C${x + w * .4},${y + h * .45} ${x + w * .7},${y + h * .98} ${x + w + 6},${y + h * .62}" stroke="${a.accent2 || a.accent}">${anim}</path></g>`;

    if (a.pattern === "cateye") extra = `<g clip-path="url(#${id})"><rect x="${x - 10}" y="${y + h * .3}" width="${w + 20}" height="${h * .34}" fill="url(#ce)">${ANIM ? `<animate attributeName="y" values="${y + h * .05};${y + h * .6};${y + h * .05}" dur="3.6s" begin="${i * .18}s" repeatCount="indefinite"/>` : ""}</rect></g>`;

        <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      </defs>
      <rect width="440" height="550" fill="${bg}"/><rect width="440" height="550" fill="url(#bgg)"/>
      <path d="M40,400 C120,330 320,330 400,400 L420,550 L20,550 Z" fill="#E2C8B9" opacity=".55"/>

/* ---------- 5. UI (modal + toast) ---------- */
const UI = {
  toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(UI._tt); UI._tt = setTimeout(() => t.classList.remove("show"), 3200);
  },
  // Abre una hoja modal. render(body, close) dibuja el contenido.
  modal({ title, render, onClose, labelledBy = "Detalle" }) {
    const root = document.getElementById("modal-root");
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${Utils.esc(labelledBy)}">
      <div class="sheet-head"><span class="eyebrow">${Utils.esc(title)}</span>
      <button class="x" aria-label="Cerrar" data-close><svg width="14" height="14" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
      <div class="sheet-content"></div></div>`;
    root.appendChild(ov);
    const prevFocus = document.activeElement;
    document.body.style.overflow = "hidden";
    const close = () => {
      ov.classList.remove("open");
      document.removeEventListener("keydown", onKey);
      setTimeout(() => { ov.remove(); if (!root.children.length) document.body.style.overflow = ""; prevFocus && prevFocus.focus && prevFocus.focus(); }, 300);
      onClose && onClose();
    };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    document.addEventListener("keydown", onKey);
    ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest("[data-close]")) close(); });
    render(ov.querySelector(".sheet-content"), close, ov.querySelector(".sheet"));
    requestAnimationFrame(() => ov.classList.add("open"));
    setTimeout(() => ov.querySelector("[data-close]").focus(), 50);
    return close;
  }
};

/* ---------- Efectos ---------- */
const Fx = {
  // Cuenta de 0 al valor final (formato moneda)
  countUp(el, to, ms = 1400) {
    if (this.reduced() || !to) { el.textContent = Utils.money(to); return; }
    const t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
      el.textContent = Utils.money(Math.round(to * e / 100) * 100);
      if (k < 1) requestAnimationFrame(tick); else el.textContent = Utils.money(to);
    };
    requestAnimationFrame(tick);
  },
  reduced() { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } },
  // Lluvia de gotitas de esmalte al confirmar la reserva
  confetti() {
    if (this.reduced()) return;
    const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
    const colors = ["#A9864F", "#EBDCD2", "#E58FA6", "#C8B6E2", "#1C1715", "#F2B8A8", "#8E1F2A"];
    for (let k = 0; k < 46; k++) {
      const i = document.createElement("i");
      i.style.left = Math.random() * 100 + "vw";
      i.style.background = colors[k % colors.length];
      i.style.setProperty("--dx", (Math.random() * 160 - 80) + "px");
      i.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
      i.style.animationDuration = (2.2 + Math.random() * 1.8) + "s";
      i.style.animationDelay = (Math.random() * .5) + "s";
      box.appendChild(i);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 4800);
  }
};

/* ---------- Disponibilidad de horarios (compartida por reserva y panel) ---------- */
const Availability = {
  // Devuelve los horarios libres para una fecha y duración dadas
  slots(dateIso, duration, ignoreId) {
    const s = Store.data.settings;
    const date = Utils.parseIso(dateIso);
    if (!s.workDays.includes(date.getDay())) return [];
    const open = Utils.toMin(s.openHour), close = Utils.toMin(s.closeHour);
    const taken = Store.data.bookings
      .filter(b => b.date === dateIso && b.status !== "cancelado" && b.id !== ignoreId)
      .map(b => [Utils.toMin(b.time), Utils.toMin(b.time) + b.duration]);
    const now = new Date();
    const isToday = Utils.iso(now) === dateIso;
    const nowMin = now.getHours() * 60 + now.getMinutes() + 120; // mínimo 2 h de anticipación
    const out = [];
    for (let t = open; t + duration <= close; t += CONFIG.slotStepMin) {
      if (isToday && t < nowMin) continue;
      if (taken.some(([a, b]) => t < b && t + duration > a)) continue;
      out.push(Utils.toHHMM(t));
    }
    return out;
  },
  dayHasSlots(dateIso, duration) { return this.slots(dateIso, duration).length > 0; },
  // Primer horario libre real para una duración (se usa como gancho de marketing honesto)
  nextFree(duration) {
    const t = Utils.today();
    for (let i = 0; i <= CONFIG.maxDaysAhead; i++) {
      const iso = Utils.iso(Utils.addDays(t, i));
      const sl = this.slots(iso, duration);
      if (sl.length) return { date: iso, time: sl[0], days: i };
    }
    return null;
  },
  label(n, short) {
    if (!n) return "";
    const w = n.days === 0 ? "hoy" : n.days === 1 ? "mañana" : Utils.parseIso(n.date).toLocaleDateString("es-AR", short ? { weekday: "short", day: "numeric" } : { weekday: "long", day: "numeric" });
    const out = w + " · " + n.time + " hs";
    return out.charAt(0).toUpperCase() + out.slice(1);
  }
};

      case "Micro francesa": return { base: color, accent: dark ? "#E8C98E" : "#FFFFFF", pattern: "microfrench" };

      case "Ojo de gato": return { base: color, accent: "#F1DDB8", pattern: "cateye" };
      case "Línea dorada": return { base: color, accent: "#B8924F", pattern: "line" };
      case "Puntitos dorados": return { base: color, accent: "#B8924F", pattern: "dots" };
      case "Lunares": return { base: color, accent: dark ? "#FFFFFF" : "#1C1715", pattern: "polka" };
      case "Aura": return { base: "#F6EEE9", accent: color, pattern: "aura" };
      default: return { base: color, accent: color, pattern: "solid" };
    }
  },

  // Mapa abstracto: muestra solo un área difusa, sin calles ni números
  zoneMap() {
    let lines = "";
    for (let i = 0; i < 9; i++) lines += `<path d="M${-20 + i * 60},0 L${40 + i * 60},400" stroke="#E1D2C7" stroke-width="${i % 3 ? 1 : 3}"/>`;
    for (let i = 0; i < 7; i++) lines += `<path d="M0,${i * 60 + 10} L520,${i * 60 - 30}" stroke="#E1D2C7" stroke-width="${i % 2 ? 1 : 3}"/>`;
    return `<svg viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice">
      <rect width="480" height="360" fill="#F6EEE8"/>${lines}
      <path d="M0,300 C120,260 200,330 320,290 S480,250 480,250 L480,360 L0,360 Z" fill="#E4D6CC" opacity=".7"/>
      <circle cx="240" cy="170" r="96" fill="#A9864F" opacity=".12"/>
      <circle cx="240" cy="170" r="56" fill="#A9864F" opacity=".14"/>
      <circle cx="240" cy="170" r="8" fill="none" stroke="#A9864F" stroke-width="1.5"><animate attributeName="r" values="8;48" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="170" r="6" fill="#1C1715"/>
      <text x="240" y="300" text-anchor="middle" font-family="Jost, sans-serif" font-size="13" letter-spacing="3" fill="#7C6D65">ZONA APROXIMADA</text>
    </svg>`;
  },

  renderGrid() {
    const list = Store.data.designs
      .filter(d => d.available && (this.filter === "Todos" || d.category === this.filter || (this.filter === "Tendencias 2026" && d.trend)))
      .sort((a, b) => (b.featured - a.featured) || ((b.trend ? 1 : 0) - (a.trend ? 1 : 0)));
    document.getElementById("grid").innerHTML = list.length ? list.map((d, i) => `
      <button class="card" data-design="${d.id}" style="animation-delay:${i * 50}ms" aria-label="${Utils.esc(d.title)}, ${Utils.esc(d.category)}, desde ${Utils.money(d.price)}">

  },

  // Probador virtual: redibuja la ilustración con el color y la terminación elegidos
  renderTry(animate) {
    const sw = document.getElementById("trySw"), fin = document.getElementById("tryFin");
    if (!sw) return;
    const st = this.tryState;
    sw.innerHTML = this.TRY_COLORS.map(([n, c], i) => `<button class="sw" style="background:${c}" aria-pressed="${i === st.color}" aria-label="${n}" title="${n}" data-sw="${i}"></button>`).join("");
    fin.innerHTML = this.TRY_FINISH.map((f, i) => `<button class="chip" aria-pressed="${i === st.fin}" data-fin="${i}">${f}</button>`).join("");
    const [cName, cHex] = this.TRY_COLORS[st.color], fName = this.TRY_FINISH[st.fin];
    const img = document.getElementById("tryImg");
    const src = NailArt.src({ id: "try", art: this.tryArt(cHex, fName) }, 1);
    document.getElementById("tryLbl").textContent = cName + " · " + fName;
    if (!animate) { img.src = src; return; }
    img.classList.add("swap");
    setTimeout(() => { img.src = src; img.classList.remove("swap"); }, 180);
  },

  openDetail(id) {
    const d = Store.data.designs.find(x => x.id === id);
    if (!d) return;
    const s = Store.publicSettings();
    const next = Availability.nextFree(d.duration);
    UI.modal({
      title: d.category, labelledBy: d.title,
      render(body, close) {
        body.innerHTML = `<div class="sheet-body detail">
          <img src="${NailArt.src(d)}" alt="${Utils.esc(d.title)}">
          <h2>${Utils.esc(d.title)}</h2>
          <p class="muted" style="margin:0">${Utils.esc(d.desc)}</p>
          <div class="facts">
            <div><small>Desde</small><b class="num">${Utils.money(d.price)}</b></div>
            <div><small>Duración</small><b>${Utils.dur(d.duration)}</b></div>
            <div><small>Seña</small><b class="num">${Utils.money(d.price * s.depositPct / 100)}</b></div>
          </div>
          ${next ? `<p class="next-slot"><span class="dot"></span><span>Primer turno libre para este diseño: <b style="color:var(--ink)">${Availability.label(next)}</b></span></p>` : ""}
          <button class="btn shine" style="width:100%" id="bookThis">Reservar este diseño <span class="arr">→</span></button>
        </div>`;
        body.querySelector("#bookThis").onclick = () => { close(); setTimeout(() => Booking.open(d.id), 320); };
      }
    });
  },

  bind() {
    const app = document.getElementById("app");
    const fine = (() => { try { return matchMedia("(pointer:fine)").matches && !Fx.reduced(); } catch (e) { return false; } })();
    app.onclick = (e) => {
      if (e.target.closest("#promoX")) { try { sessionStorage.setItem("velume.promo", "x"); } catch (er) { } document.getElementById("promo").remove(); return; }
      const b = e.target.closest("[data-book]"); if (b) { e.preventDefault(); Booking.open(); return; }
      const sc = e.target.closest("[data-scroll]"); if (sc) { e.preventDefault(); document.getElementById(sc.dataset.scroll).scrollIntoView({ behavior: "smooth" }); return; }
      const c = e.target.closest("[data-cat]"); if (c) { this.filter = c.dataset.cat; this.renderChips(); this.renderGrid(); return; }
      const sv = e.target.closest("[data-svc]"); if (sv) { Booking.open(sv.dataset.svc); return; }
      const sw = e.target.closest("[data-sw]"); if (sw) { this.tryState.color = Number(sw.dataset.sw); this.renderTry(true); return; }
      const fn = e.target.closest("[data-fin]"); if (fn) { this.tryState.fin = Number(fn.dataset.fin); this.renderTry(true); return; }
      if (e.target.closest("#tryBook")) {
        const look = this.TRY_COLORS[this.tryState.color][0] + " · " + this.TRY_FINISH[this.tryState.fin];
        Booking.open(null, { notas: "Look del probador: " + look }); return;
      }
    };

    // Header, barra de progreso y CTA fijo
    const top = document.getElementById("top"), cta = document.getElementById("stickyCta"), bar = document.getElementById("scrollbar");
    const onScroll = () => {
      top.classList.toggle("scrolled", scrollY > 8);
      cta.classList.toggle("hide", scrollY < 380);
      const h = document.documentElement.scrollHeight - innerHeight;
      bar.style.setProperty("--p", h > 0 ? Math.min(1, scrollY / h) : 0);
    };
    window.onscroll = onScroll; onScroll();

    // Contador animado del precio "desde"
    app.querySelectorAll("[data-count]").forEach(el => Fx.countUp(el, Number(el.dataset.count)));

    // Inclinación 3D del collage del hero y botones magnéticos (solo con mouse)
    if (fine) {
      const art = document.getElementById("heroArt");
      art.onpointermove = (e) => {
        const r = art.getBoundingClientRect();
        art.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 8 + "deg");
        art.style.setProperty("--rx", -((e.clientY - r.top) / r.height - .5) * 8 + "deg");
      };
      art.onpointerleave = () => { art.style.setProperty("--rx", "0deg"); art.style.setProperty("--ry", "0deg"); };
      app.querySelectorAll(".mag").forEach(m => {
        m.onpointermove = (e) => { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .18}px,${(e.clientY - r.top - r.height / 2) * .3}px)`; };
        m.onpointerleave = () => { m.style.transform = ""; };
      });
    }

    // Secciones que aparecen suavemente al hacer scroll
    const els = app.querySelectorAll(".sec-head, .step, .zone > *, .perk, .svc, .try-stage, .gift, .review, .ig, .faq details, .final .wrap > :not(.spark)");
    els.forEach(el => el.classList.add("reveal"));
    [".step", ".perk", ".svc", ".review", ".faq details"].forEach(q => app.querySelectorAll(q).forEach((el, i) => el.style.setProperty("--i", i)));
    if (!("IntersectionObserver" in window)) { els.forEach(el => el.classList.add("in")); return; }
    const io = new IntersectionObserver((entries) => entries.forEach(en => {
      if (!en.isIntersecting) return;
      const el = en.target; el.classList.add("in"); io.unobserve(el);
      // al terminar, se quita la clase para que vuelvan los efectos hover propios
      setTimeout(() => el.classList.remove("reveal", "in"), 900 + (parseFloat(getComputedStyle(el).getPropertyValue("--i")) || 0) * 90);
    }), { threshold: .12 });
    els.forEach(el => io.observe(el));
  }
};

/* =========================================================

const Booking = {
  open(designId, prefill = {}) {
    const st = { step: designId ? 2 : 1, designId: designId || null, date: null, time: null, month: null, form: { nombre: "", apellido: "", telefono: "", notas: prefill.notas || "" }, booking: null };

      title: "Reservar turno", labelledBy: "Reservar turno",

  draw(st, body, close) {
    const designs = Store.data.designs.filter(d => d.available);

          <button class="opt" role="radio" aria-checked="${x.id === st.designId}" data-pick="${x.id}">
            <img src="${NailArt.src(x)}" alt=""><span class="t"><b>${Utils.esc(x.title)}</b><small>${Utils.esc(x.category)} · ${Utils.dur(x.duration)}</small></span>
            <span class="p num">${Utils.money(x.price)}</span></button>`).join("")}</div>`;
      foot = `<button class="btn" data-next ${st.designId ? "" : "disabled"}>Continuar</button>`;
    }

    if (st.step === 2) {
      html = `<span class="eyebrow">Paso 2 de 4</span><h2 class="wz-title">Elegí día y horario</h2>
        <p class="muted" style="margin:0">${Utils.esc(d.title)} · ${Utils.dur(d.duration)}</p>
        ${this.calendar(st, d)}
        <div id="slotsWrap">${st.date ? this.slotsHtml(st, d) : '<p class="hint" style="margin-top:14px">Seleccioná un día para ver los horarios libres.</p>'}</div>`;
      foot = `<button class="btn ghost" data-back>Atrás</button><button class="btn" data-next ${st.date && st.time ? "" : "disabled"}>Continuar</button>`;
    }

    if (st.step === 3) {
      const f = st.form;
      html = `<span class="eyebrow">Paso 3 de 4</span><h2 class="wz-title">Tus datos</h2>
        <p class="muted" style="margin:0">Los usamos solo para coordinar tu turno.</p>
        <form id="dataForm" novalidate>
          <div class="row2">
            <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" name="nombre" autocomplete="given-name" value="${Utils.esc(f.nombre)}" required><span class="err"></span></div>
            <div class="field"><label for="f-apellido">Apellido</label><input id="f-apellido" name="apellido" autocomplete="family-name" value="${Utils.esc(f.apellido)}" required><span class="err"></span></div>
          </div>
          <div class="field"><label for="f-telefono">WhatsApp</label><input id="f-telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 2281 456789" value="${Utils.esc(f.telefono)}" required><span class="err"></span><span class="hint">Código de área + número, sin 0 ni 15.</span></div>
          <div class="field"><label for="f-photo">Foto de lo que querés (opcional)</label>
            ${f.photo ? `<div class="ref-prev"><img src="${f.photo}" alt="Tu foto de referencia"><div class="t"><b>¡Perfecto! Ya tenemos tu idea.</b><label class="link" style="cursor:pointer;position:relative">Cambiar foto<input id="f-photo" type="file" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%"></label> · <button type="button" class="link" data-rmphoto>Quitar</button></div></div>`
            : `<label class="ref-up"><input id="f-photo" type="file" accept="image/*"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg></span><span><b>Subí una foto o captura</b><small>De Pinterest, Instagram o tus uñas anteriores. Nos ayuda a preparar tu turno.</small></span></label>`}
          </div>
          <div class="field"><label for="f-notas">Comentarios (opcional)</label><textarea id="f-notas" name="notas" placeholder="Largo deseado, si tenés uñas para retirar, alergias…">${Utils.esc(f.notas)}</textarea></div>
        </form>`;
      foot = `<button class="btn ghost" data-back>Atrás</button><button class="btn" data-submit>Confirmar reserva</button>`;
    }

    if (st.step === 4) {
      const b = st.booking;
      const dep = Math.round(b.price * s.depositPct / 100);
      const msg = `Hola Velume! Acabo de reservar un turno:\n• Servicio: ${b.serviceName}\n• Fecha: ${Utils.longDate(b.date)}, ${b.time} hs\n• Nombre: ${b.nombre} ${b.apellido}\n• WhatsApp: ${b.telefono}\n• Código: ${b.code}${b.notas ? "\n• Comentarios: " + b.notas : ""}${b.photo ? "\n• Foto de referencia: te la adjunto 📷" : ""}\n\nQuedo atenta a los datos para enviar la seña de ${Utils.money(dep)}.`;
      html = `<div class="done-mark"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <span class="eyebrow">Paso 4 de 4 · Solicitud registrada</span><h2 class="wz-title">¡Casi lista, ${Utils.esc(b.nombre)}!</h2>
        <p class="muted" style="margin:0">Tu horario queda reservado de forma provisoria. Código <span class="code">${b.code}</span></p>
        <div class="summary">
          <div><span>Servicio</span><b>${Utils.esc(b.serviceName)}</b></div>
          <div><span>Fecha</span><b style="text-transform:capitalize">${Utils.longDate(b.date)}</b></div>
          <div><span>Horario</span><b class="num">${b.time} hs · ${Utils.dur(b.duration)}</b></div>
          <div><span>Precio estimado</span><b class="num">${Utils.money(b.price)}</b></div>
          <div><span>Zona</span><b>${Utils.esc(s.zone)}</b></div>
          ${b.photo ? `<div style="align-items:center"><span>Tu foto de referencia</span><img src="${b.photo}" alt="" style="width:52px;height:64px;object-fit:cover;border-radius:8px"></div>` : ""}
        </div>
        <div class="notice">
          <h3>Política de seña</h3>
          <p>Para asegurar el turno se abona una seña del <b>${s.depositPct}% (${Utils.money(dep)})</b>, que se descuenta del total. Los datos para transferir te llegan por WhatsApp.</p>
          <p>Si no se recibe la seña dentro de las 24 h, el horario se libera. Cancelaciones con menos de 24 h de aviso pierden la seña.</p>
        </div>
        <div class="notice" style="background:none;border:1px solid var(--line)">
          <h3>¿Y la dirección?</h3>
          <p>Por privacidad del estudio, la dirección exacta se envía por WhatsApp una vez confirmada la seña.</p>
        </div>
        <p class="hint" style="margin-top:14px">Último paso: avisanos por WhatsApp para recibir los datos de la seña.${b.photo && !st.canShare ? " <b>Al abrir el chat, adjuntá tu foto con el clip 📎.</b>" : ""}</p>
        ${b.photo && st.canShare ? `<p class="hint" style="margin-top:6px">Se abre el menú para compartir: elegí WhatsApp y enviá la foto con tu reserva. <a class="link" href="${Utils.waLink(s.studioWhatsapp, msg)}" target="_blank" rel="noopener">Enviar solo el mensaje</a></p>` : ""}`;
      st.waMsg = msg;
      foot = b.photo && st.canShare
        ? `<button class="btn wa" data-share>Enviar reserva + foto</button><button class="btn ghost" data-close>Cerrar</button>`
        : `<a class="btn wa" href="${Utils.waLink(s.studioWhatsapp, msg)}" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn ghost" data-close>Cerrar</button>`;
    }

    body.innerHTML = prog + `<div class="sheet-body pane">${html}</div><div class="wz-foot">${foot}</div>`;
    this.bind(st, body, d);
    if (st.step === 4 && !st.celebrated) { st.celebrated = true; Fx.confetti(); }
  },

  calendar(st, d) {
    const t = Utils.today(), last = Utils.addDays(t, CONFIG.maxDaysAhead);
    const m = st.month, y = m.getFullYear(), mo = m.getMonth();
    const first = (new Date(y, mo, 1).getDay() + 6) % 7; // lunes primero
    const days = new Date(y, mo + 1, 0).getDate();
    let cells = ["Lu", "Ma", "Mi", "Ju", "Vi", "Sá", "Do"].map(x => `<span class="dow">${x}</span>`).join("");
    for (let i = 0; i < first; i++) cells += "<span></span>";
    for (let n = 1; n <= days; n++) {
      const date = new Date(y, mo, n), iso = Utils.iso(date);
      const ok = date >= t && date <= last && Availability.dayHasSlots(iso, d.duration);
      cells += `<button class="day ${iso === Utils.iso(t) ? "today" : ""}" data-date="${iso}" ${ok ? "" : "disabled"} aria-pressed="${iso === st.date}" aria-label="${Utils.longDate(iso)}${ok ? "" : ", sin horarios"}">${n}</button>`;
    }
    const canPrev = new Date(y, mo, 1) > new Date(t.getFullYear(), t.getMonth(), 1);
    const canNext = new Date(y, mo + 1, 1) <= last;
    return `<div class="cal"><div class="cal-head">
      <button class="cal-nav" data-month="-1" aria-label="Mes anterior" ${canPrev ? "" : "disabled"}>‹</button>
      <b>${m.toLocaleDateString("es-AR", { month: "long", year: "numeric" })}</b>
      <button class="cal-nav" data-month="1" aria-label="Mes siguiente" ${canNext ? "" : "disabled"}>›</button></div>
      <div class="cal-grid">${cells}</div></div>`;
  },

  slotsHtml(st, d) {
    const sl = Availability.slots(st.date, d.duration);
    return `<p class="hint" style="margin:16px 0 0;text-transform:capitalize">${Utils.longDate(st.date)}</p>
      <div class="slots" role="group" aria-label="Horarios">${sl.map(x => `<button class="slot" data-time="${x}" aria-pressed="${x === st.time}">${x}</button>`).join("")}</div>`;
  },

  bind(st, body, d) {
    body.onclick = (e) => {
      const pick = e.target.closest("[data-pick]");
      if (pick) { st.designId = pick.dataset.pick; st.date = null; st.time = null; st.redraw(); return; }
      if (e.target.closest("[data-next]")) { st.step++; st.redraw(); return; }
      if (e.target.closest("[data-back]")) { if (st.step === 3) this.readForm(st, body); st.step--; st.redraw(); return; }
      const mon = e.target.closest("[data-month]");
      if (mon) { st.month = new Date(st.month.getFullYear(), st.month.getMonth() + Number(mon.dataset.month), 1); st.redraw(); return; }
      const day = e.target.closest("[data-date]");
      if (day) { st.date = day.dataset.date; st.time = null; st.redraw(); return; }
      const time = e.target.closest("[data-time]");
      if (time) {
        st.time = time.dataset.time;
        body.querySelectorAll("[data-time]").forEach(b => b.setAttribute("aria-pressed", b === time));
        body.querySelector("[data-next]").disabled = false;
        return;
      }
      if (e.target.closest("[data-submit]")) { this.submit(st, body); return; }
      if (e.target.closest("[data-rmphoto]")) { this.readForm(st, body); st.form.photo = null; st.redraw(); return; }
      if (e.target.closest("[data-share]")) {
        // Comparte la foto + el mensaje (en celular se elige WhatsApp en el menú del sistema)
        navigator.share({ files: [st.shareFile], text: st.waMsg }).catch(err => {
          if (err && err.name !== "AbortError") window.open(Utils.waLink(Store.publicSettings().studioWhatsapp, st.waMsg), "_blank");
        });
        return;
      }
    };
    body.onchange = async (e) => {
      if (e.target.id !== "f-photo") return;
      const file = e.target.files[0]; if (!file) return;
      if (!/^image\//.test(file.type)) return UI.toast("Elegí una imagen (JPG o PNG).");
      try {
        const data = await Utils.resizeImage(file, 720);
        this.readForm(st, body); st.form.photo = data; st.redraw();
        UI.toast("Foto agregada ✨");
      } catch (err) { UI.toast("No pudimos leer esa imagen. Probá con otra."); }
    };
  },

  readForm(st, body) {
    const f = body.querySelector("#dataForm"); if (!f) return;
    ["nombre", "apellido", "telefono", "notas"].forEach(k => st.form[k] = f.elements[k].value.trim());
  },

  submit(st, body) {
    this.readForm(st, body);
    const f = st.form, form = body.querySelector("#dataForm");
    const errs = {
      nombre: f.nombre.length < 2 ? "Escribí tu nombre." : "",
      apellido: f.apellido.length < 2 ? "Escribí tu apellido." : "",
      telefono: !Utils.validPhone(f.telefono) ? "Revisá el número: código de área + número (10 dígitos)." : ""
    };
    let first = null;
    Object.entries(errs).forEach(([k, m]) => {
      const field = form.elements[k].closest(".field");
      field.classList.toggle("invalid", !!m); field.querySelector(".err").textContent = m;
      if (m && !first) first = form.elements[k];
    });
    if (first) { first.focus(); return; }

    const d = Store.data.designs.find(x => x.id === st.designId);
    // Re-chequeo de disponibilidad por si el horario se ocupó mientras completaba
    if (!Availability.slots(st.date, d.duration).includes(st.time)) {
      UI.toast("Ese horario acaba de ocuparse. Elegí otro, por favor.");
      st.step = 2; st.time = null; st.redraw(); return;
    }
    const b = {
      id: Utils.uid("b"), code: Utils.code(), designId: d.id, serviceName: d.title, price: d.price, duration: d.duration,
      date: st.date, time: st.time, nombre: f.nombre, apellido: f.apellido, telefono: f.telefono, notas: f.notas,
      photo: f.photo || null, status: "pendiente", createdAt: Date.now()
    };
    Store.data.bookings.push(b);
    if (!Store.save() && b.photo) { b.photo = null; Store.save(); } // si no entra la foto, se guarda el turno igual
    // ¿El celular puede compartir la imagen directo a WhatsApp?
    st.canShare = false;
    if (f.photo) {
      try {
        st.shareFile = Utils.dataUrlToFile(f.photo, "foto-referencia-" + b.code + ".jpg");
        st.canShare = !!(navigator.canShare && navigator.canShare({ files: [st.shareFile] }));
      } catch (err) { }
    }
    st.booking = b; st.step = 4; st.redraw();
  }
};

  /* ---------- Login ---------- */
  renderLogin() {
    const app = document.getElementById("app");
    app.innerHTML = `<div class="wrap"><form class="login pane" id="loginForm">
      <a class="logo" href="#">Velume <em>nails</em></a>
      <h1>Panel del estudio</h1>
      <p class="muted" style="margin:0">Ingresá tu contraseña para gestionar turnos y servicios.</p>
      <div class="field"><label for="pass">Contraseña</label><input id="pass" type="password" autocomplete="current-password" required><span class="err" id="passErr"></span></div>
      <button class="btn" style="width:100%;margin-top:18px">Ingresar</button>
      <p class="hint" style="margin-top:14px">Demo: la contraseña inicial es <b>velume2026</b>. Cambiala en Ajustes.</p>
      <a href="#" class="link" style="display:inline-block;margin-top:6px">← Volver al sitio</a>
    </form></div>`;
    const f = app.querySelector("#loginForm");
    f.onsubmit = async (e) => {
      e.preventDefault();
      const h = await Utils.sha256(f.querySelector("#pass").value);
      const stored = Store.data.settings.private.passHash || CONFIG.defaultPassHash;
      if (h === stored) { this.setLogged(true); this.render(); }
      else { app.querySelector("#passErr").textContent = "Contraseña incorrecta."; f.querySelector("#pass").select(); }
    };
    setTimeout(() => f.querySelector("#pass").focus(), 60);
  },

  /* ---------- Turnos ---------- */
  renderTurnos(body) {
    const todayIso = Utils.iso(Utils.today());
    const all = [...Store.data.bookings].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    const filters = { proximos: "Próximos", pendiente: "Pendientes", confirmado: "Confirmados", cancelado: "Cancelados", pasados: "Historial" };
    const list = all.filter(b => {
      if (this.bkFilter === "proximos") return b.date >= todayIso && b.status !== "cancelado";
      if (this.bkFilter === "pasados") return b.date < todayIso;
      return b.status === this.bkFilter;
    });
    if (this.bkFilter === "pasados") list.reverse();
    const groups = {};
    list.forEach(b => (groups[b.date] = groups[b.date] || []).push(b));

    body.innerHTML = `<div class="toolbar">
        <div class="chips">${Object.entries(filters).map(([k, l]) => `<button class="chip" aria-pressed="${this.bkFilter === k}" data-f="${k}">${l}</button>`).join("")}</div>
        <button class="btn sm" id="newBk">+ Cargar turno</button>
      </div>
      ${!Store.data.settings.private.address ? `<div class="notice" style="margin:0 0 14px;border:1px solid var(--warn);background:#FBF3E6">Todavía no cargaste la dirección del estudio. Hacelo en <button class="link" data-goto="ajustes">Ajustes</button> para poder enviar recordatorios.</div>` : ""}
      ${Object.keys(groups).length ? Object.entries(groups).map(([date, items]) => `
        <div class="day-group"><h3>${date === todayIso ? "Hoy · " : ""}${Utils.longDate(date)}</h3>
          ${items.map(b => this.bookingCard(b)).join("")}</div>`).join("") : `<p class="empty">No hay turnos en esta vista.</p>`}`;

    body.onclick = (e) => {
      const f = e.target.closest("[data-f]"); if (f) { this.bkFilter = f.dataset.f; this.renderTurnos(body); return; }
      const g = e.target.closest("[data-goto]"); if (g) { this.tab = g.dataset.goto; this.render(); return; }
      if (e.target.closest("#newBk")) { this.bookingForm(); return; }
      const a = e.target.closest("[data-act]"); if (!a) return;
      const b = Store.data.bookings.find(x => x.id === a.dataset.id);
      if (a.dataset.act === "confirm") { b.status = "confirmado"; Store.save(); UI.toast("Turno confirmado. Ya podés enviarle la dirección."); this.render(); }
      if (a.dataset.act === "cancel") { this.confirmBox("¿Cancelar el turno de " + b.nombre + "?", "El horario vuelve a quedar libre.", () => { b.status = "cancelado"; Store.save(); this.render(); }); }
      if (a.dataset.act === "restore") { b.status = "pendiente"; Store.save(); this.render(); }
      if (a.dataset.act === "edit") { this.bookingForm(b); }
      if (a.dataset.act === "photo") {
        UI.modal({ title: "Foto de referencia", labelledBy: "Foto de referencia de " + b.nombre, render(mb) {
          mb.innerHTML = `<div class="sheet-body"><img class="ref-full" src="${b.photo}" alt="Foto de referencia de ${Utils.esc(b.nombre)}"><p class="muted" style="margin:12px 0 0">${Utils.esc(b.nombre)} ${Utils.esc(b.apellido)} · ${Utils.esc(b.serviceName)} · ${Utils.longDate(b.date)}, ${b.time} hs</p><a class="btn ghost" style="width:100%;margin-top:14px" href="${b.photo}" download="referencia-${b.code}.jpg">Descargar foto</a></div>`;
        } });
      }
    };
  },

  bookingCard(b) {
    const s = Store.data.settings, p = s.private;
    const dep = Math.round(b.price * s.depositPct / 100);
    const phone = Utils.waNumber(b.telefono);
    // Mensaje para pedir la seña: NO incluye la dirección.
    const askDeposit = `Hola ${b.nombre}! Soy de Velume Nails. Recibimos tu reserva (${b.code}):\n• ${b.serviceName}\n• ${Utils.longDate(b.date)}, ${b.time} hs\n\nPara confirmar el turno, la seña es de ${Utils.money(dep)}.${p.depositAlias ? "\nAlias: " + p.depositAlias : ""}\nCuando la envíes, mandame el comprobante y te paso la dirección exacta.`;
    // Recordatorio con dirección: SOLO disponible si el turno está confirmado.
    const reminder = `Hola ${b.nombre}! Te recuerdo tu turno en Velume Nails:\n• ${b.serviceName}\n• ${Utils.longDate(b.date)}, ${b.time} hs\n\nDirección: ${p.address}${p.addressNotes ? "\n" + p.addressNotes : ""}\n\nPor favor, avisame si no podés asistir. ¡Te espero!`;
    const canRemind = b.status === "confirmado" && p.address;
    const label = { pendiente: "Pendiente de seña", confirmado: "Confirmado", cancelado: "Cancelado" }[b.status];
    return `<article class="bk ${b.status}">
      <div class="bk-top">
        <div style="display:flex;gap:14px;align-items:flex-start">
          <span class="bk-time">${b.time}</span>
          <div class="bk-who"><b>${Utils.esc(b.nombre)} ${Utils.esc(b.apellido)}</b>
            <small>${Utils.esc(b.serviceName)} · ${Utils.dur(b.duration)} · <span class="num">${Utils.money(b.price)}</span></small>
            <small class="num">${Utils.esc(b.telefono)} · ${b.code}</small>
            ${b.notas ? `<small>“${Utils.esc(b.notas)}”</small>` : ""}</div>
          ${b.photo ? `<button class="ref-thumb" data-act="photo" data-id="${b.id}" aria-label="Ver foto de referencia de ${Utils.esc(b.nombre)}" title="Foto de referencia"><img src="${b.photo}" alt=""></button>` : ""}
        </div>
        <span class="pill ${b.status}">${label}</span>
      </div>
      <div class="bk-actions">
        ${b.status === "pendiente" ? `<button class="btn sm" data-act="confirm" data-id="${b.id}">Aprobar · seña recibida</button>
          <a class="btn sm ghost" href="${Utils.waLink(phone, askDeposit)}" target="_blank" rel="noopener">Pedir seña</a>` : ""}
        ${b.status === "confirmado" ? (canRemind
          ? `<a class="btn sm wa" href="${Utils.waLink(phone, reminder)}" target="_blank" rel="noopener">Recordatorio + dirección</a>`
          : `<button class="btn sm" disabled title="Cargá la dirección en Ajustes">Recordatorio + dirección</button>`) : ""}
        ${b.status !== "cancelado" ? `<button class="btn sm ghost" data-act="edit" data-id="${b.id}">Editar</button><button class="btn sm ghost" data-act="cancel" data-id="${b.id}">Cancelar</button>`
          : `<button class="btn sm ghost" data-act="restore" data-id="${b.id}">Reactivar</button>`}
      </div>
    </article>`;
  },

  // Alta/edición manual de turnos (ej: clienta que reservó por Instagram)
  bookingForm(existing) {
    const b = existing || { designId: Store.data.designs[0].id, date: Utils.iso(Utils.addDays(Utils.today(), 1)), time: "10:00", nombre: "", apellido: "", telefono: "", notas: "", status: "pendiente" };
    UI.modal({
      title: existing ? "Editar turno" : "Cargar turno",
      render: (body, close) => {
        body.innerHTML = `<form class="sheet-body" id="bkForm" novalidate>
          <div class="field"><label for="b-design">Servicio</label><select id="b-design">${Store.data.designs.map(d => `<option value="${d.id}" ${d.id === b.designId ? "selected" : ""}>${Utils.esc(d.title)} · ${Utils.dur(d.duration)}</option>`).join("")}</select></div>
          <div class="row2">
            <div class="field"><label for="b-date">Fecha</label><input id="b-date" type="date" value="${b.date}" required></div>
            <div class="field"><label for="b-time">Hora</label><input id="b-time" type="time" step="900" value="${b.time}" required></div>
          </div>
          <div class="row2">
            <div class="field"><label for="b-nombre">Nombre</label><input id="b-nombre" value="${Utils.esc(b.nombre)}" required></div>
            <div class="field"><label for="b-apellido">Apellido</label><input id="b-apellido" value="${Utils.esc(b.apellido)}"></div>
          </div>
          <div class="field"><label for="b-tel">WhatsApp</label><input id="b-tel" type="tel" value="${Utils.esc(b.telefono)}" required></div>
          <div class="field"><label for="b-status">Estado</label><select id="b-status">${["pendiente", "confirmado", "cancelado"].map(s => `<option value="${s}" ${s === b.status ? "selected" : ""}>${{ pendiente: "Pendiente de seña", confirmado: "Confirmado", cancelado: "Cancelado" }[s]}</option>`).join("")}</select></div>
          <div class="field"><label for="b-notas">Notas</label><textarea id="b-notas">${Utils.esc(b.notas)}</textarea></div>
          <p class="err" id="bkErr" style="color:var(--bad);font-size:.85rem"></p>
          <button class="btn" style="width:100%">Guardar turno</button>
        </form>`;
        body.querySelector("#bkForm").onsubmit = (e) => {
          e.preventDefault();
          const $ = (id) => body.querySelector(id).value.trim();
          const d = Store.data.designs.find(x => x.id === $("#b-design"));
          if (!$("#b-nombre") || !Utils.validPhone($("#b-tel")) || !$("#b-date") || !$("#b-time")) { body.querySelector("#bkErr").textContent = "Completá nombre, fecha, hora y un WhatsApp válido."; return; }
          // Aviso de superposición (no bloquea: la manicura decide)
          const st = Utils.toMin($("#b-time")), en = st + d.duration;
          const clash = Store.data.bookings.find(x => x.id !== b.id && x.date === $("#b-date") && x.status !== "cancelado" && st < Utils.toMin(x.time) + x.duration && en > Utils.toMin(x.time));
          const data = { designId: d.id, serviceName: d.title, price: d.price, duration: d.duration, date: $("#b-date"), time: $("#b-time"), nombre: $("#b-nombre"), apellido: $("#b-apellido"), telefono: $("#b-tel"), notas: $("#b-notas"), status: $("#b-status") };
          if (existing) Object.assign(existing, data);
          else Store.data.bookings.push({ id: Utils.uid("b"), code: Utils.code(), createdAt: Date.now(), ...data });
          Store.save(); close(); this.render();
          UI.toast(clash ? "Guardado. Ojo: se superpone con el turno de " + clash.nombre + "." : "Turno guardado.");
        };
      }
    });
  },

  confirmBox(title, text, onYes) {
    UI.modal({
      title: "Confirmar",
      render(body, close) {
        body.innerHTML = `<div class="sheet-body"><h2 class="wz-title">${Utils.esc(title)}</h2><p class="muted">${Utils.esc(text)}</p>
          <div style="display:flex;gap:10px;margin-top:18px"><button class="btn ghost" data-close style="flex:1">Volver</button><button class="btn" id="yes" style="flex:1">Sí, continuar</button></div></div>`;
        body.querySelector("#yes").onclick = () => { onYes(); close(); };
      }
    });
  },

  /* ---------- Diseños ---------- */
  renderDisenos(body) {
    const ds = Store.data.designs;
    body.innerHTML = `<div class="toolbar"><p class="muted" style="margin:0">${ds.length} servicios · ${ds.filter(d => d.available).length} visibles en el sitio. Tocá Editar para cambiar precio, duración o foto.</p></div>
      <div class="adm-list">${ds.map(d => `
        <div class="adm-item">
          <img src="${NailArt.src(d)}" alt="">
          <div class="t"><b>${Utils.esc(d.title)}</b><small>${Utils.esc(d.category)} · <span class="num">${Utils.money(d.price)}</span> · ${Utils.dur(d.duration)}</small>
            <div class="flags"><span class="flag ${d.available ? "on" : ""}">${d.available ? "Disponible" : "Oculto"}</span>${d.featured ? '<span class="flag on">Destacado</span>' : ""}${d.photo ? '<span class="flag">Foto real</span>' : ""}</div></div>
          <button class="btn sm ghost" data-edit="${d.id}">Editar</button>

  designForm(existing) {
    const d = existing ? { ...existing } : { title: "", category: CONFIG.categories[0], price: 20000, duration: 90, desc: "", available: true, featured: false, photo: null, art: { base: "#E9D2C5", accent: "#B8924F", pattern: "solid" } };
    UI.modal({
      title: existing ? "Editar servicio" : "Nuevo servicio",
      render: (body, close) => {
        body.innerHTML = `<form class="sheet-body" id="dForm" novalidate>
          <div class="field"><label>Foto del trabajo</label>
            <div class="upload"><img id="dPrev" src="${NailArt.src(d)}" alt="Vista previa">
              <div><input type="file" id="dFile" accept="image/*" style="max-width:100%"><p class="hint">Se optimiza automáticamente. Ideal: foto vertical con luz natural.</p>
              ${d.photo ? '<button type="button" class="link" id="dRmPhoto">Quitar foto</button>' : ""}</div></div></div>
          <div class="field"><label for="d-title">Título</label><input id="d-title" value="${Utils.esc(d.title)}" required></div>
          <div class="field"><label for="d-cat">Categoría</label><select id="d-cat">${CONFIG.categories.map(c => `<option ${c === d.category ? "selected" : ""}>${c}</option>`).join("")}</select></div>
          <div class="row2">
            <div class="field"><label for="d-price">Precio desde ($)</label><input id="d-price" type="number" inputmode="numeric" min="0" step="500" value="${d.price}"></div>
            <div class="field"><label for="d-dur">Duración (min)</label><input id="d-dur" type="number" inputmode="numeric" min="15" step="15" value="${d.duration}"></div>
          </div>
          <div class="field"><label for="d-desc">Descripción</label><textarea id="d-desc">${Utils.esc(d.desc)}</textarea></div>
          <label class="switch" for="d-av"><span>Disponible en el sitio</span><input type="checkbox" id="d-av" ${d.available ? "checked" : ""}></label>
          <label class="switch" for="d-ft"><span>Destacado (aparece primero y en portada)</span><input type="checkbox" id="d-ft" ${d.featured ? "checked" : ""}></label>
          <p class="err" id="dErr" style="color:var(--bad);font-size:.85rem"></p>
          <div style="display:flex;gap:10px;margin-top:8px">
            
            <button class="btn" style="flex:1">Guardar servicio</button></div>
        </form>`;
        const $ = (s) => body.querySelector(s);
        $("#dFile").onchange = async (e) => {
          const file = e.target.files[0]; if (!file) return;
          try { d.photo = await Utils.resizeImage(file); $("#dPrev").src = d.photo; }
          catch (err) { UI.toast("No se pudo leer la imagen. Probá con JPG o PNG."); }
        };
        if ($("#dRmPhoto")) $("#dRmPhoto").onclick = () => { d.photo = null; $("#dPrev").src = NailArt.src({ ...d, id: d.id || "tmp" }); };
        if ($("#dDel")) $("#dDel").onclick = () => this.confirmBox("¿Eliminar “" + existing.title + "”?", "Los turnos ya reservados con este diseño se mantienen.", () => {
          Store.data.designs = Store.data.designs.filter(x => x.id !== existing.id); Store.save(); close(); this.render();
        });
        $("#dForm").onsubmit = (e) => {
          e.preventDefault();
          const title = $("#d-title").value.trim(), price = Number($("#d-price").value), dur = Number($("#d-dur").value);
          if (!title) return $("#dErr").textContent = "Poné un título.";
          if (!(price >= 0) || !(dur >= 15)) return $("#dErr").textContent = "Revisá precio y duración (mínimo 15 min).";
          Object.assign(d, { title, category: $("#d-cat").value, price, duration: dur, desc: $("#d-desc").value.trim(), available: $("#d-av").checked, featured: $("#d-ft").checked });
          if (existing) Object.assign(existing, d); else Store.data.designs.unshift({ id: Utils.uid("d"), ...d });
          if (Store.save()) { close(); this.render(); UI.toast("Servicio guardado."); }
        };
      }
    });
  },

  /* ---------- Reseñas ----------
     Solo reseñas reales que las clientas dejaron (Google, Instagram, WhatsApp).
     Si no hay ninguna, el sitio muestra el bloque de Instagram. */
  renderResenas(body) {
    const rv = Store.data.reviews || (Store.data.reviews = []);
    body.innerHTML = `<form class="panel" id="rvForm" novalidate>
        <h3>Agregar reseña</h3>
        <p class="hint" style="margin:4px 0 0">Copiá comentarios reales de tus clientas (con su permiso). Las reseñas verdaderas son las que más venden.</p>
        <div class="row2">
          <div class="field"><label for="r-name">Nombre a mostrar</label><input id="r-name" placeholder="Ej: Camila F." maxlength="40"></div>
          <div class="field"><label for="r-stars">Estrellas</label><select id="r-stars">${[5, 4, 3].map(n => `<option value="${n}">${"★".repeat(n)}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label for="r-text">Comentario</label><textarea id="r-text" maxlength="260"></textarea></div>
        <p class="err" id="rvErr" style="color:var(--bad);font-size:.85rem"></p>
        <button class="btn">Publicar reseña</button>
      </form>
      <div class="adm-list">${rv.length ? rv.map((r, i) => `<div class="rv-item"><div><b>${Utils.esc(r.name)}</b> <span style="color:var(--gold)">${"★".repeat(r.stars)}</span><p>${Utils.esc(r.text)}</p></div><button class="btn sm ghost" data-rdel="${i}">Quitar</button></div>`).join("") : '<p class="empty">Todavía no cargaste reseñas. Mientras tanto, el sitio muestra tu Instagram.</p>'}</div>`;
    body.querySelector("#rvForm").onsubmit = (e) => {
      e.preventDefault();
      const name = body.querySelector("#r-name").value.trim(), text = body.querySelector("#r-text").value.trim();
      if (!name || text.length < 8) return body.querySelector("#rvErr").textContent = "Completá el nombre y un comentario.";
      rv.unshift({ name, text, stars: Number(body.querySelector("#r-stars").value) });
      Store.save(); UI.toast("Reseña publicada."); this.renderResenas(body);
    };
    body.onclick = (e) => {
      const d = e.target.closest("[data-rdel]"); if (!d) return;
      rv.splice(Number(d.dataset.rdel), 1); Store.save(); this.renderResenas(body);
    };
  },

      const days = [...body.querySelectorAll(".days-pick input:checked")].map(i => Number(i.value));
      if (!days.length) return UI.toast("Elegí al menos un día de atención.");
      if (Utils.toMin($("#s-open").value) >= Utils.toMin($("#s-close").value)) return UI.toast("El horario de cierre tiene que ser posterior a la apertura.");
      Object.assign(s, { zone: $("#s-zone").value.trim(), studioWhatsapp: Utils.waNumber($("#s-wa").value), instagram: $("#s-ig").value.replace(/^@/, "").trim(), openHour: $("#s-open").value, closeHour: $("#s-close").value, workDays: days, depositPct: Math.min(100, Math.max(0, Number($("#s-dep").value) || 0)), promoOn: $("#s-promoOn").checked, promoText: $("#s-promo").value.trim(), giftOn: $("#s-gift").checked });
      Store.save(); UI.toast("Datos públicos guardados."); this.render();
    };
    $("#privForm").onsubmit = (e) => {
      e.preventDefault();
      Object.assign(p, { address: $("#p-addr").value.trim(), addressNotes: $("#p-notes").value.trim(), depositAlias: $("#p-alias").value.trim() });
      Store.save(); UI.toast("Datos privados guardados.");
    };
    $("#passForm").onsubmit = async (e) => {
      e.preventDefault();
      const a = $("#np1").value, b = $("#np2").value;
      if (a.length < 8) return $("#passErr2").textContent = "Usá al menos 8 caracteres.";
      if (a !== b) return $("#passErr2").textContent = "Las contraseñas no coinciden.";
      p.passHash = await Utils.sha256(a); Store.save();
      $("#passErr2").textContent = ""; e.target.reset(); UI.toast("Contraseña actualizada.");
    };
    $("#resetAll").onclick = () => this.confirmBox("¿Restablecer la demo?", "Se borran tus cambios en este navegador.", () => { Store.reset(); this.tab = "turnos"; this.render(); });
  }
};

/* =========================================================
   9. ROUTER
   #admin → panel · cualquier otro → sitio público
   ========================================================= */
function route() {
  document.getElementById("modal-root").innerHTML = "";
  document.body.style.overflow = "";
  scrollTo(0, 0);
  if (location.hash === "#admin") Admin.render();
  else { Public.render(); if (location.hash === "#reservar") Booking.open(); }
}

(async function init() {
  CONFIG.defaultPassHash = await Utils.sha256(CONFIG.defaultPass);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
